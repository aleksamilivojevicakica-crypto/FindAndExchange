<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Войти | SwapChain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <div class="container">
        <h1>Войти в аккаунт</h1>
        {% with messages = get_flashed_messages() %}
          {% for message in messages %}<p class="auth-notice">{{ message }}</p>{% endfor %}
        {% endwith %}
        {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
        <form action="{{ url_for('login_page') }}" method="POST">
            <input type="email" name="email" placeholder="Email" autocomplete="email" required>
            <input type="password" name="password" placeholder="Пароль" autocomplete="current-password" required>
            <button type="submit">Войти</button>
        </form>
        <div class="auth-footer">
            Нет аккаунта? <a href="{{ url_for('register_page') }}">Создать аккаунт</a>
            <p><a href="{{ url_for('index') }}">← На главную</a></p>
        </div>
    </div>
</body>
</html>
